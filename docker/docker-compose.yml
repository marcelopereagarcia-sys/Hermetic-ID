version: "3.8"

services:
  hermetic-id:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hermetic-id
    restart: unless-stopped
    # COMPLIANCE: Binding estricto a 127.0.0.1 (evita exposición fuera del host)
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      - GRADIO_ANALYTICS_ENABLED=False
      - PYTHONUNBUFFERED=1
