name: Hermetic-ID CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Test & Forensic Quality Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # libgl1-mesa-glx ya no existe en Ubuntu 24.04 (ubuntu-latest); OpenCV necesita libgl1 + libglib2.0-0
      - name: Install System Dependencies (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run Pytest Test Suite
        env:
          HERMETIC_OFFLINE_MODE: "false"
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=75
